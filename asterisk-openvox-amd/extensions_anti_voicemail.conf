; ==============================================================================
; SADI · DIALPLAN ANTI-BUZÓN PRE-ANSWER (ANTES DE SIP 200 OK / CERO COBRO)
; Ubicación sugerida: /etc/asterisk/extensions_custom.conf
; ==============================================================================

[sadi-outbound-preanswer]
; Toda llamada saliente hacia OpenVox entra SIN ejecutar Answer() para mantener
; el canal en fase provisional (180 Ringing / 183 Session Progress).
exten => _X.,1,NoOp(SADI Pre-Answer Anti-Voicemail -> Destino: ${EXTEN} | Paciente: ${SADI_PATIENT_ID})
 same => n,Set(CHANNEL(language)=es)
 ; Modo ARI recomendado: Stasis captura Early Media 183 por ExternalMedia UDP
 ; y corta con SIP CANCEL antes del 200 OK si detecta buzón de Claro/Movistar/Tigo.
 same => n,Stasis(sadi_anti_voicemail,${EXTEN},${SADI_PATIENT_ID},${SADI_DOCTOR_ID},${SADI_HOSPITAL_ID},${SADI_SLOT_TANDA})
 same => n,Hangup()

; Alternativa sin Stasis (Fallback puro de Dialplan con timeout estricto pre-buzón):
; En operadores colombianos el desvío a buzón por no respuesta ocurre entre 20s y 25s.
; Limitar Dial() a 19s cancela la llamada en etapa 180/183 antes de que facture el carrier.
[sadi-outbound-dialplan-only]
exten => _X.,1,NoOp(SADI Timeout Pre-Buzón -> ${EXTEN})
 same => n,Set(SADI_RING_MAX=${IF($["${SADI_RING_MAX}" != ""]?${SADI_RING_MAX}:19)})
 same => n,Dial(PJSIP/${EXTEN}@openvox-gsm-32p,${SADI_RING_MAX},b(sadi-early-media-hook^s^1))
 same => n,NoOp(Estado final Dial=${DIALSTATUS} HangupCause=${HANGUPCAUSE})
 same => n,Hangup()

[sadi-early-media-hook]
exten => s,1,NoOp(Habilitando captura Early Media SIP 183 sin responder llamada)
 same => n,Progress()
 same => n,Return()

[from-vapi]
; Cuando Vapi dispara hacia el trunk local pasando número destino E.164
exten => _+57X.,1,Goto(sadi-outbound-preanswer,${EXTEN},1)
exten => _57X.,1,Goto(sadi-outbound-preanswer,${EXTEN},1)
exten => _3XXXXXXXXX,1,Goto(sadi-outbound-preanswer,+57${EXTEN},1)

