; ==============================================================================
; SADI · PJSIP TRUNK CONFIGURATION FOR OPENVOX GSM 32-PORT GATEWAY + VAPI SIP
; Ubicación sugerida en servidor Asterisk 18/20+: /etc/asterisk/pjsip_custom.conf
; ==============================================================================

[transport-udp-sadi]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ------------------------------------------------------------------------------
; 1. GATEWAY FÍSICO OPENVOX GSM (32 PUERTOS / SIMs CLARO, MOVISTAR, TIGO, WOM)
; Nota crítica: `inband_progress=yes` permite recibir audio SIP 183 (Early Media)
; mientras la línea móvil aún no responde con 200 OK.
; ------------------------------------------------------------------------------
[openvox-gsm-32p]
type=endpoint
transport=transport-udp-sadi
context=from-openvox
disallow=all
allow=ulaw
allow=alaw
aors=openvox-gsm-32p-aor
dtmf_mode=rfc4733
direct_media=no
inband_progress=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
timers=yes
from_domain=${OPENVOX_GATEWAY_HOST}

[openvox-gsm-32p-aor]
type=aor
contact=sip:${OPENVOX_GATEWAY_HOST}:5060
qualify_frequency=0

[openvox-gsm-32p-identify]
type=identify
endpoint=openvox-gsm-32p
match=${OPENVOX_GATEWAY_HOST}

; ------------------------------------------------------------------------------
; 2. TRONCAL SIP DE ENLACE HACIA AGENTE IA VAPI
; Solo recibe llamadas una vez validado que NO es buzón en etapa Early Media.
; ------------------------------------------------------------------------------
[vapi-sip-trunk]
type=endpoint
transport=transport-udp-sadi
context=from-vapi
disallow=all
allow=ulaw
allow=alaw
aors=vapi-sip-aor
dtmf_mode=rfc4733
direct_media=no
inband_progress=no
rtp_symmetric=yes
force_rport=yes

[vapi-sip-aor]
type=aor
contact=sip:sip.vapi.ai:5060
qualify_frequency=0

